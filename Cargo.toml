[workspace]
resolver = "2"
members = [
    "crates/httrack-core",
    "crates/httrack-cli",
    "crates/webhttrack",
    "crates/winhttrack-gui",
]

[workspace.package]
version = "3.51.0"
edition = "2024"
authors = ["Original HTTrack by Xavier Roche & contributors (https://www.httrack.com/) — Unofficial Rust Alternative"]
license = "GPL-3.0-or-later"
homepage = "https://www.httrack.com/"
repository = "https://github.com/xroche/httrack"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "zstd", "deflate", "cookies", "stream", "socks"] }
scraper = "0.22"
url = "2.5"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
uuid = { version = "1.11", features = ["v4"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
eframe = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
